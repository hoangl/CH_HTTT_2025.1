user  nginx;
worker_processes  1;events {
  worker_connections  1024;
}

http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    root /store-ui;
    index index.html;

    location /api/products/ {
      proxy_pass http://products-service:5000/;
    }

    location /api/cart/ {
      proxy_pass http://cart-service:8080/;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}